<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星河裂變｜報名成功</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../assets/style.css">
<!-- GA4 / Meta Pixel 轉換追蹤碼貼在這裡（感謝頁） -->
</head>
<body class="booking-page">

<header class="nav">
  <div class="wrap">
    <a class="logo" data-back href="#"><img src="../assets/logo.svg" alt="" width="36" height="34">星河<span>裂變</span></a>
  </div>
</header>

<section class="soft booking">
  <div class="wrap">
    <div class="thanks-card">
      <div class="thanks-mark" aria-hidden="true">✓</div>
      <span class="eyebrow" data-copy="eyebrow">報名成功</span>
      <h1 data-copy="title">謝謝你，我們說明會見</h1>
      <div class="picked" data-picked-wrap>
        <p class="muted" data-copy="pickedLabel">你報名的場次</p>
        <ul data-picked></ul>
      </div>
      <p class="lead" data-copy="lead">線上會議連結將由專人另行通知，請留意你的 Email</p>
      <a class="btn ghost" data-back href="#">← 回到介紹</a>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>© 星河裂變</p>
  </div>
</footer>

<script src="../assets/booking.js"></script>
</body>
</html>
