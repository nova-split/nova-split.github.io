{%- comment -%}
全站導覽列：首頁與部落格共用（A/B/C 廣告頁、報名頁刻意維持精簡版，不使用這個檔案）
用法：include header.html，並傳入 current="home" 或 current="blog"
{%- endcomment -%}
<header class="nav">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="36" height="34">星河<span>裂變</span></a>
    <nav class="nav-links">
      <a class="hide-sm{% if include.current == 'home' %} on{% endif %}" href="{{ '/' | relative_url }}">產品介紹</a>
      <a{% if include.current == 'blog' %} class="on"{% endif %} href="{{ '/blog/' | relative_url }}">部落格</a>
      <a class="btn" data-booking href="{{ '/booking/' | relative_url }}">預約演示</a>
    </nav>
  </div>
</header>
