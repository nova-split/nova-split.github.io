<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{%- seo -%}
{%- feed_meta -%}
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="blog-page" data-variant="blog" data-booking-url="{{ '/booking/index.html' | relative_url }}">

{% include header.html current="blog" %}

{{ content }}

<footer class="blog-footer">
  <div class="wrap">
    <div class="cols">
      <div>
        <a class="logo" href="{{ '/' | relative_url }}"><img src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="36" height="34">星河<span>裂變</span></a>
        <p>{{ site.description }}</p>
      </div>
      <div>
        <b>產品</b>
        <a href="{{ '/' | relative_url }}">產品介紹</a>
        <a data-booking href="{{ '/booking/' | relative_url }}">預約演示</a>
      </div>
      <div>
        <b>部落格</b>
        <a href="{{ '/blog/' | relative_url }}">所有文章</a>
        <a href="{{ '/blog/tags/' | relative_url }}">標籤</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS 訂閱</a>
      </div>
    </div>
    <p class="copy">© 星河裂變</p>
  </div>
</footer>

<script src="{{ '/assets/main.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/blog.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
