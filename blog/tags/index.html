---
layout: blog
title: Tags
---
<h1>Tags</h1>
{% assign tags = site.tags | sort %}
{% for tag in tags %}
<h2 id="{{ tag[0] | slugify }}">{{ tag[0] }} <span class="post-meta">({{ tag[1].size }})</span></h2>
<ul class="post-list">
  {% for post in tag[1] %}
  <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span></li>
  {% endfor %}
</ul>
{% endfor %}
