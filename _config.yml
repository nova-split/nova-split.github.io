title: 星河裂變｜社群代操的內容交付流程
description: 給同時管多個品牌的行銷團隊：把品牌資料、內容、排程和交付紀錄接起來。

url: "https://novasplit.ai"
baseurl: ""
repository: nova-split/nova-split.github.io

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  parse_block_html: true

# Not part of the published site — build tooling and repo docs.
exclude:
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - .dockerignore
  - docker-compose.yml
  - README.md
  - CLAUDE.md
  - vendor
  - node_modules
  - .claude
  - .tmp
